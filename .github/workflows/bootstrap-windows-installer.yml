name: Bootstrap Windows installer
on:
  push:
    paths:
      - '.github/workflows/bootstrap-windows-installer.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/windows-desktop-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Add minimal Forge dependencies and lockfile
        shell: pwsh
        run: |
          npm install --save-dev @electron-forge/cli @electron-forge/maker-squirrel --no-audit --no-fund
          npm install electron-squirrel-startup --save --no-audit --no-fund
          node -e "let p=require('./package.json');p.productName='Tolou Concrete QC';p.author='Engineer Erfan Amiri';p.scripts={...p.scripts,package:'npm run build && electron-forge package',make:'npm run build && electron-forge make'};require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Commit reproducible dependency lock
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Add minimal Windows installer toolchain'
          git push origin HEAD:feature/windows-desktop-foundation
