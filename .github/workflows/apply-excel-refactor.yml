name: Apply Excel workbook refactor
on:
  push:
    branches: [feature/windows-desktop-foundation]
    paths:
      - .github/workflows/apply-excel-refactor.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/windows-desktop-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/refactor-excel-workbook.mjs
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/main.ts
          git diff --cached --check
          git commit -m "Use shared project report workbook builder"
          git push origin HEAD:feature/windows-desktop-foundation
