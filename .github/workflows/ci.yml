name: Windows desktop checks
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify original production game asset
        shell: pwsh
        run: |
          $expected = '9ee25a8b214d56823ff5f1bd0d82f2109ff3f7b15c7eb101c29e579b3c2e6d18'
          $source = 'resources/games/tolou-production-management/index.html'
          $copied = 'dist-electron/games/tolou-batching-arcade.html'
          if (-not (Test-Path $source)) { throw "Original game asset missing: $source" }
          if (-not (Test-Path $copied)) { throw "Built game asset missing: $copied" }
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $copiedHash = (Get-FileHash $copied -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne $expected) { throw "Source game hash mismatch: $sourceHash" }
          if ($copiedHash -ne $expected) { throw "Built game hash mismatch: $copiedHash" }
          Write-Host "Game asset integrity verified: $expected"
      - name: Package Windows app without installer
        run: npx electron-forge package --platform=win32 --arch=x64
      - name: Verify packaged Electron app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out -Filter TolouConcreteQC.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Packaged TolouConcreteQC.exe was not found.' }
          $appAsar = Get-ChildItem -Path out -Filter app.asar -Recurse | Select-Object -First 1
          if (-not $appAsar) { throw 'Packaged app.asar was not found.' }
          $fuses = (npx electron-fuses read --app $exe.FullName 2>&1 | Out-String)
          Write-Host $fuses
          @(
            'RunAsNode is Disabled',
            'EnableNodeOptionsEnvironmentVariable is Disabled',
            'EnableNodeCliInspectArguments is Disabled',
            'EnableEmbeddedAsarIntegrityValidation is Enabled',
            'OnlyLoadAppFromAsar is Enabled'
          ) | ForEach-Object {
            if (-not $fuses.Contains($_)) { throw "Required Electron fuse state missing: $_" }
          }
