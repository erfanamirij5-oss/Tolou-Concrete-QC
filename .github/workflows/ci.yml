name: Windows desktop checks
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vendor pinned SheetJS release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/windows-desktop-foundation' && hashFiles('vendor/xlsx-0.20.3.tgz') == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest -Uri 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz' -OutFile 'vendor/xlsx-0.20.3.tgz'
          $hash = (Get-FileHash 'vendor/xlsx-0.20.3.tgz' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SheetJS 0.20.3 SHA256: $hash"
          npm pkg set 'dependencies.xlsx=file:vendor/xlsx-0.20.3.tgz'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/xlsx-0.20.3.tgz package.json package-lock.json
          git commit -m 'Vendor SheetJS 0.20.3 and lock dependencies'
          git push origin HEAD:feature/windows-desktop-foundation
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
