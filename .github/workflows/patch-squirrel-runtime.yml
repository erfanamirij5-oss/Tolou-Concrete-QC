name: Patch Squirrel runtime handling
on:
  push:
    paths:
      - '.github/workflows/patch-squirrel-runtime.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/windows-desktop-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch Windows Squirrel runtime integration
        shell: pwsh
        run: |
          $path = 'src/main/main.ts'
          $content = Get-Content -Raw -Path $path
          $oldImport = @'
          import { fileURLToPath } from 'node:url';
          '@.Trim()
          $newImport = @'
          import { fileURLToPath } from 'node:url';
          import { createRequire } from 'node:module';
          '@.Trim()
          $oldRuntime = @'
          const __dirname=dirname(fileURLToPath(import.meta.url)); let runtime:DatabaseRuntime|undefined;
          '@.Trim()
          $newRuntime = @'
          const require=createRequire(import.meta.url);
          const handledSquirrelEvent=process.platform==='win32'&&Boolean(require('electron-squirrel-startup'));
          if(handledSquirrelEvent)app.quit();
          if(process.platform==='win32')app.setAppUserModelId('com.squirrel.tolou_concrete_qc.TolouConcreteQC');
          const __dirname=dirname(fileURLToPath(import.meta.url)); let runtime:DatabaseRuntime|undefined;
          '@.Trim()
          if (-not $content.Contains($oldImport)) { throw 'Expected node:url import not found' }
          if (-not $content.Contains($oldRuntime)) { throw 'Expected runtime anchor not found' }
          $content = $content.Replace($oldImport, $newImport).Replace($oldRuntime, $newRuntime)
          Set-Content -Path $path -Value $content -NoNewline -Encoding utf8
      - name: Verify patch and typecheck
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Commit runtime integration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/main.ts
          git commit -m 'Handle Squirrel Windows lifecycle and app identity'
          git push origin HEAD:feature/windows-desktop-foundation
